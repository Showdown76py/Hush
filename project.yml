name: Hush
options:
  bundleIdPrefix: io.github.showdown76py
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: 0.2.1
    # independent of MARKETING_VERSION. app offers a driver update (admin password)
    # when this exceeds the installed driver's, only bump if the driver changes
    HUSH_DRIVER_VERSION: 14
    CURRENT_PROJECT_VERSION: 2
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # hardened runtime only for developer id signing (scripts/release.sh)
    # w/ ad-hoc, library validation would block loading sparkle
    ENABLE_HARDENED_RUNTIME: NO
    SPARKLE_PUBLIC_KEY: "FABqLVzoRZgTz7s/WjtfJkkyNL3ogoT1VkOdr6KVhZk="
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO
targets:
  Hush:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/RealTime
      - path: App/Resources
      - path: App/AppIcon.icon
        type: file
      - path: App/Hush-Bridging-Header.h
        buildPhase: none
    dependencies:
      # vendored by scripts/fetch-sparkle.sh since xcodebuild can hang downloading
      # swiftpm binaries
      - framework: Vendor/Sparkle/Sparkle.framework
        embed: true
        codeSign: true
      - target: HushDriver
        embed: true
        codeSign: false   # signed by its own target
        copy:
          destination: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.showdown76py.Hush
        PRODUCT_NAME: Hush
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Hush.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: App/Hush-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Shared", "$(SRCROOT)/App/RealTime"]
        FRAMEWORK_SEARCH_PATHS: ["$(SRCROOT)/Vendor/Sparkle"]
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        GCC_C_LANGUAGE_STANDARD: c11
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  HushDriver:
    type: bundle
    platform: macOS
    sources:
      - path: Driver/HushDriver.c
      - path: Shared
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: Hush
        PRODUCT_BUNDLE_IDENTIFIER: io.github.showdown76py.Hush.Driver
        WRAPPER_EXTENSION: driver
        INFOPLIST_FILE: Driver/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Shared"]
        GCC_C_LANGUAGE_STANDARD: c11
        GCC_SYMBOLS_PRIVATE_EXTERN: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        OTHER_LDFLAGS: ["-framework", "CoreAudio", "-framework", "CoreFoundation"]
        SKIP_INSTALL: YES
        DEFINES_MODULE: NO
  HushTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests
    dependencies:
      - target: Hush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.showdown76py.Hush.Tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hush.app/Contents/MacOS/Hush"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: App/Hush-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Shared", "$(SRCROOT)/App/RealTime"]
        FRAMEWORK_SEARCH_PATHS: ["$(SRCROOT)/Vendor/Sparkle"]
schemes:
  Hush:
    build:
      targets:
        Hush: all
        HushTests: [test]
    test:
      targets:
        - HushTests
