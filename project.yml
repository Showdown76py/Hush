name: Hush
options:
  bundleIdPrefix: io.github.showdown76py
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 2
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    # Le hardened runtime n'est activé que pour la signature Developer ID (scripts/release.sh) :
    # en signature ad-hoc, la validation des bibliothèques empêcherait de charger Sparkle.
    ENABLE_HARDENED_RUNTIME: NO
    SPARKLE_PUBLIC_KEY: "FABqLVzoRZgTz7s/WjtfJkkyNL3ogoT1VkOdr6KVhZk="
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      ONLY_ACTIVE_ARCH: NO
targets:
  Hush:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/RealTime
      - path: App/Resources
      - path: App/AppIcon.icon
        type: file
      - path: App/Hush-Bridging-Header.h
        buildPhase: none
    dependencies:
      # Sparkle est vendoré par scripts/fetch-sparkle.sh (le téléchargement SwiftPM des binaires
      # peut se bloquer en CI / derrière certains proxys).
      - framework: Vendor/Sparkle/Sparkle.framework
        embed: true
        codeSign: true
      - target: HushDriver
        embed: true
        codeSign: false   # signé par sa propre cible
        copy:
          destination: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.showdown76py.Hush
        PRODUCT_NAME: Hush
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Hush.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: App/Hush-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Shared", "$(SRCROOT)/App/RealTime"]
        FRAMEWORK_SEARCH_PATHS: ["$(SRCROOT)/Vendor/Sparkle"]
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        GCC_C_LANGUAGE_STANDARD: c11
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  HushDriver:
    type: bundle
    platform: macOS
    sources:
      - path: Driver/HushDriver.c
      - path: Shared
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: Hush
        PRODUCT_BUNDLE_IDENTIFIER: io.github.showdown76py.Hush.Driver
        WRAPPER_EXTENSION: driver
        INFOPLIST_FILE: Driver/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Shared"]
        GCC_C_LANGUAGE_STANDARD: c11
        GCC_SYMBOLS_PRIVATE_EXTERN: YES
        GCC_TREAT_WARNINGS_AS_ERRORS: YES
        OTHER_LDFLAGS: ["-framework", "CoreAudio", "-framework", "CoreFoundation"]
        SKIP_INSTALL: YES
        DEFINES_MODULE: NO
  HushTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: App/Tests
    dependencies:
      - target: Hush
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.showdown76py.Hush.Tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hush.app/Contents/MacOS/Hush"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: App/Hush-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Shared", "$(SRCROOT)/App/RealTime"]
        FRAMEWORK_SEARCH_PATHS: ["$(SRCROOT)/Vendor/Sparkle"]
schemes:
  Hush:
    build:
      targets:
        Hush: all
        HushTests: [test]
    test:
      targets:
        - HushTests
