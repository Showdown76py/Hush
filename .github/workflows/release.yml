name: Release

# publishes a github release w/ the dmg on each vX.Y.Z tag (eg git tag v0.2.0 && git push --tags)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex. 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # build number = commit count

      - name: Version
        run: |
          V="${{ github.event.inputs.version }}"
          [ -n "$V" ] || V="${GITHUB_REF_NAME#v}"
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Outils
        run: brew install xcodegen

      - name: Certificat de signature (si configuré)
        env:
          P12: ${{ secrets.HUSH_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.HUSH_SIGNING_P12_PASSWORD }}
        if: env.P12 != ''
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/hush.p12"
          security import "$RUNNER_TEMP/hush.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

      - name: Clé Sparkle (si configurée)
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        if: env.SPARKLE_KEY != ''
        run: |
          printf '%s' "$SPARKLE_KEY" > "$RUNNER_TEMP/sparkle.key"
          chmod 600 "$RUNNER_TEMP/sparkle.key"
          echo "SPARKLE_KEY_FILE=$RUNNER_TEMP/sparkle.key" >> "$GITHUB_ENV"

      - name: Build, signature, DMG
        run: ./scripts/release.sh "$VERSION"

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          FILES=(build/release/Hush-$VERSION.dmg)
          [ -f build/release/appcast.xml ] && FILES+=(build/release/appcast.xml)
          gh release create "v$VERSION" "${FILES[@]}" --title "Hush $VERSION" --generate-notes \
            || gh release upload "v$VERSION" "${FILES[@]}" --clobber
