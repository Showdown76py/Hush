name: CI

on:
  # the website doesn't need a macOS build
  push:
    paths-ignore: ["site/**", "scripts/site-audio/**", "scripts/make-site-audio.py", "scripts/serve-site.py"]
  pull_request:
    paths-ignore: ["site/**", "scripts/site-audio/**", "scripts/make-site-audio.py", "scripts/serve-site.py"]

jobs:
  build-and-test:
    # liquid glass and the .icon icon need the macOS 26 sdk (xcode 26+)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Outils
        run: |
          brew install xcodegen
          xcodebuild -version

      - name: Tests du driver (AddressSanitizer + UBSan)
        run: |
          mkdir -p build
          clang -O1 -g -fsanitize=address,undefined -std=c11 -Wall -Werror -I Shared \
            -framework CoreAudio -framework CoreFoundation Driver/Tests/driver_test.c -o build/driver_test
          build/driver_test

      - name: Le projet Xcode est à jour avec project.yml
        run: |
          xcodegen generate
          git diff --exit-code -- Hush.xcodeproj

      - name: Sparkle
        run: scripts/fetch-sparkle.sh

      - name: Tests unitaires de l'app
        run: |
          xcodebuild -project Hush.xcodeproj -scheme Hush -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGN_IDENTITY=- test

      - name: Certificat de signature auto-signé (si les secrets existent)
        env:
          P12: ${{ secrets.HUSH_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.HUSH_SIGNING_P12_PASSWORD }}
        if: env.P12 != ''
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/hush.p12"
          security import "$RUNNER_TEMP/hush.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')

      - name: Build de release + DMG
        run: ./scripts/release.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Hush-dmg
          path: build/release/*.dmg
          if-no-files-found: error
